<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>PocraEnd</title>
    <style>
      :root {
        --bg: #0a0a0b;
        --surface: #141416;
        --border: #26262a;
        --text: #e8e8ea;
        --muted: #86868b;
        --accent: #7c5cff;
        --danger: #ff5c5c;
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        font-family: 'Inter', system-ui, sans-serif;
        background: var(--surface);
        color: var(--text);
        border: 1px solid var(--border);
        border-radius: 16px;
        overflow: hidden;
        height: 100vh;
        padding: 24px;
        -webkit-app-region: drag;
        display: flex;
        flex-direction: column;
      }
      .topic {
        font-size: 12px;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 0.05em;
        margin-bottom: 4px;
        flex-shrink: 0;
      }
      .distraction {
        font-size: 14px;
        color: var(--muted);
        margin-bottom: 12px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        flex-shrink: 0;
      }
      .message {
        font-size: 16px;
        line-height: 1.5;
        margin-bottom: 16px;
        overflow-y: auto;
        flex: 1;
      }
      .buttons {
        display: flex;
        flex-direction: column;
        gap: 8px;
        flex-shrink: 0;
        -webkit-app-region: no-drag;
      }
      button {
        font-family: inherit;
        font-size: 14px;
        padding: 12px;
        border-radius: 8px;
        border: 1px solid var(--border);
        background: var(--bg);
        color: var(--text);
        cursor: pointer;
        transition: background 0.15s;
      }
      button:hover { background: #1f1f23; }
      button.primary {
        background: var(--accent);
        border-color: var(--accent);
        font-weight: 600;
      }
      button.primary:hover { opacity: 0.9; }
      .counter {
        font-size: 11px;
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <div class="topic" id="topic">Working on —</div>
    <div class="distraction" id="distraction">You opened —</div>
    <div class="message" id="message">Loading…</div>
    <div class="buttons">
      <button class="primary" onclick="action('grind')">Let's grind</button>
      <button onclick="action('snooze')">
        Waste 5 more minutes <span class="counter" id="snoozeCounter"></span>
      </button>
      <button onclick="action('wrong_guess')">Wrong guess — leave me alone</button>
    </div>

    <script>
      window.popupAPI.onInit((data) => {
        document.getElementById('topic').textContent = `Working on — ${data.topic}`;
        document.getElementById('distraction').textContent = `You opened — ${data.distraction}`;
        document.getElementById('message').textContent = data.message;
        const sc = document.getElementById('snoozeCounter');
        sc.textContent = data.snoozesLeft > 0 ? `(${data.snoozesLeft} left)` : '(no snoozes left)';
        if (data.snoozesLeft <= 0) {
          document.querySelectorAll('button')[1].disabled = true;
          document.querySelectorAll('button')[1].style.opacity = '0.4';
        }
      });

      function action(name) {
        window.popupAPI.action(name);
      }
    </script>
  </body>
</html>
